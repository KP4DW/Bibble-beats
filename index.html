<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff7ac8" />
  <title>Bibble's Beats</title>
  <style>
    :root {
      --bg1: #ff7ac8;
      --bg2: #7657ff;
      --bg3: #79f6e4;
      --ink: #fff9ff;
      --glass: rgba(255,255,255,.14);
      --glass-border: rgba(255,255,255,.32);
      --shadow: rgba(33, 10, 67, .32);
      --accent: #fff7aa;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--bg3) 62%, transparent) 0 12%, transparent 38%),
        radial-gradient(circle at 82% 78%, color-mix(in srgb, var(--bg1) 60%, transparent) 0 14%, transparent 40%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      transition: background 700ms cubic-bezier(.2,.8,.2,1), color 450ms ease;
      cursor: pointer;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -25vmax;
      z-index: -4;
      pointer-events: none;
      background: conic-gradient(from 20deg, transparent 0 12%, rgba(255,255,255,.11), transparent 30% 55%, rgba(255,255,255,.09), transparent 77%);
      filter: blur(36px);
      animation: drift 15s linear infinite;
    }
    body::after { animation-direction: reverse; animation-duration: 21s; opacity: .55; transform: scale(.76); }

    @keyframes drift { to { transform: rotate(1turn) scale(1.06); } }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .09;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .orb {
      position: absolute;
      width: 24rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(3px);
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.58), color-mix(in srgb, var(--accent) 34%, transparent) 34%, transparent 68%);
      opacity: .52;
      animation: float 7s ease-in-out infinite;
      pointer-events: none;
      z-index: -2;
    }
    .orb.one { left: -8rem; top: 9vh; }
    .orb.two { right: -9rem; bottom: -6rem; animation-delay: -3.5s; transform: scale(.8); }
    @keyframes float { 50% { translate: 0 -18px; scale: 1.04; } }

    main {
      width: min(1180px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 24px 0 20px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      z-index: 8;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(150%);
      box-shadow: 0 18px 45px var(--shadow);
      font-weight: 850;
      letter-spacing: -.02em;
      user-select: none;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { scale: .72; opacity: .7; } }

    .mini { opacity: .82; font-size: .84rem; font-weight: 650; }

    .hero {
      display: grid;
      place-items: center;
      align-self: stretch;
      position: relative;
      perspective: 1100px;
      min-height: 0;
    }

    .copy {
      position: absolute;
      top: 4%;
      left: 0;
      z-index: 5;
      max-width: 520px;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 7.4vw, 7.8rem);
      line-height: .83;
      letter-spacing: -.075em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 15px 55px rgba(36,14,60,.23);
    }
    .copy p {
      margin: 18px 0 0;
      max-width: 38ch;
      font-size: clamp(.98rem, 1.6vw, 1.12rem);
      line-height: 1.5;
      font-weight: 650;
      opacity: .88;
    }

    .stage-wrap {
      width: min(830px, 76vw);
      aspect-ratio: 16 / 9;
      position: relative;
      transform-style: preserve-3d;
      animation: breathe 5.5s ease-in-out infinite;
      margin-top: 7vh;
    }
    @keyframes breathe {
      0%,100% { transform: rotateX(2deg) rotateY(-3deg) translateY(4px); }
      50% { transform: rotateX(-2deg) rotateY(3deg) translateY(-10px); }
    }

    .stage-shadow {
      position: absolute;
      left: 12%; right: 12%; bottom: -7%;
      height: 13%;
      border-radius: 50%;
      background: rgba(36, 12, 64, .34);
      filter: blur(28px);
      transform: translateZ(-60px) rotateX(78deg);
    }

    .stage {
      position: absolute;
      inset: 0;
      padding: 10px;
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(255,255,255,.52), rgba(255,255,255,.12));
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 34px 80px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.15);
      backdrop-filter: blur(20px) saturate(150%);
      transform: translateZ(30px);
      transition: transform 250ms ease;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg, rgba(255,255,255,.8), transparent 36%, var(--accent), transparent 66%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 5;
    }

    .video-shell {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      border-radius: 25px;
      background: #111;
      box-shadow: inset 0 0 70px rgba(0,0,0,.22);
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.01);
      filter: saturate(1.08) contrast(1.03);
    }
    .video-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 110px rgba(30,9,50,.18);
      pointer-events: none;
    }


    /* Bibble is interactive: tap him for a wave + heart reaction. */
    .video-shell {
      cursor: pointer;
      isolation: isolate;
      touch-action: manipulation;
    }
    .video-shell:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }
    .bibble-tip {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 9;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(17, 10, 28, .38);
      border: 1px solid rgba(255,255,255,.24);
      backdrop-filter: blur(10px);
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
      pointer-events: none;
      transition: transform .2s ease, background .2s ease;
    }
    .video-shell:hover .bibble-tip { transform: translateY(-3px) scale(1.03); }
    .video-shell.play-blocked .bibble-tip {
      background: rgba(17, 10, 28, .72);
      animation: tipPulse 1.1s ease-in-out infinite;
    }
    @keyframes tipPulse { 50% { transform: scale(1.06); } }

    .video-shell.bibble-reacting {
      animation: bibbleWaveShell 900ms cubic-bezier(.2,.9,.2,1);
    }
    .video-shell.bibble-reacting video {
      animation: bibbleWaveVideo 900ms cubic-bezier(.2,.9,.2,1);
    }
    @keyframes bibbleWaveShell {
      0%,100% { transform: rotate(0deg) scale(1); }
      18% { transform: rotate(-1.5deg) scale(1.012); }
      38% { transform: rotate(1.5deg) scale(1.018); }
      58% { transform: rotate(-1deg) scale(1.014); }
      78% { transform: rotate(.7deg) scale(1.008); }
    }
    @keyframes bibbleWaveVideo {
      0%,100% { transform: scale(1.01) translateY(0); }
      30% { transform: scale(1.035) translateY(-4px); }
      60% { transform: scale(1.025) translateY(1px); }
    }

    .heart-reaction {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 47%;
      translate: -50% -50%;
      color: var(--accent);
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(43,10,65,.28));
      animation: heartFloat 1050ms cubic-bezier(.16,.9,.3,1) forwards;
    }
    @keyframes heartFloat {
      0% { opacity: 0; transform: translate(var(--hx, 0px), 18px) scale(.35) rotate(var(--hr, 0deg)); }
      18% { opacity: 1; transform: translate(var(--hx, 0px), 0) scale(1.12) rotate(var(--hr, 0deg)); }
      100% { opacity: 0; transform: translate(calc(var(--hx, 0px) * 1.5), -115px) scale(.78) rotate(var(--hr, 0deg)); }
    }

    .status {
      position: absolute;
      right: 19px;
      top: 19px;
      z-index: 7;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(15,11,24,.36);
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(10px);
    }
    .bars { display: inline-flex; align-items: end; gap: 2px; height: 12px; }
    .bars i { width: 2px; border-radius: 2px; background: var(--accent); animation: eq 760ms ease-in-out infinite alternate; }
    .bars i:nth-child(1){ height: 5px; }
    .bars i:nth-child(2){ height: 10px; animation-delay: -180ms; }
    .bars i:nth-child(3){ height: 7px; animation-delay: -340ms; }
    .bars i:nth-child(4){ height: 12px; animation-delay: -520ms; }
    @keyframes eq { to { height: 3px; opacity: .65; } }

    .sticker {
      position: absolute;
      right: -2.2rem;
      bottom: 8%;
      z-index: 8;
      width: clamp(92px, 11vw, 135px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #3d245f;
      font-weight: 950;
      line-height: .9;
      text-align: center;
      text-transform: uppercase;
      transform: translateZ(65px) rotate(9deg);
      box-shadow: 0 16px 35px rgba(43,18,63,.27);
      border: 7px solid rgba(255,255,255,.82);
      user-select: none;
      transition: background 450ms ease, transform 250ms ease;
    }



    .sticker { cursor: pointer; }
    .sticker:hover { transform: translateZ(65px) rotate(4deg) scale(1.06); }
    .sticker:active { transform: translateZ(65px) rotate(9deg) scale(.94); }

    .message-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(19, 8, 33, .28);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    .message-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .message-card {
      width: min(520px, 90vw);
      position: relative;
      padding: clamp(34px, 6vw, 56px) 28px;
      border-radius: 34px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,.34), rgba(255,255,255,.14));
      border: 1px solid rgba(255,255,255,.52);
      box-shadow: 0 34px 90px rgba(30, 8, 53, .34);
      backdrop-filter: blur(24px) saturate(160%);
      transform: translateY(18px) scale(.9) rotate(-2deg);
      transition: transform 300ms cubic-bezier(.2,.9,.25,1.18);
    }
    .message-modal.open .message-card {
      transform: translateY(0) scale(1) rotate(0deg);
    }
    .message-card::before {
      content: "♡";
      position: absolute;
      top: 14px;
      left: 20px;
      font-size: 1.6rem;
      color: var(--accent);
      text-shadow: 0 0 22px var(--accent);
    }
    .message-text {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.6rem);
      line-height: .95;
      font-weight: 950;
      letter-spacing: -.055em;
      text-transform: lowercase;
      text-shadow: 0 12px 32px rgba(32, 10, 55, .24);
    }
    .message-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      font-size: 1.25rem;
      line-height: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      appearance: none;
      border: 1px solid var(--glass-border);
      color: var(--ink);
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(150%);
      box-shadow: 0 12px 32px rgba(40,15,64,.18);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: .84rem;
      font-weight: 820;
      cursor: pointer;
      transition: transform 150ms ease, background 250ms ease;
    }
    button:hover { transform: translateY(-2px); background: rgba(255,255,255,.23); }
    button:active { transform: translateY(0) scale(.97); }

    .hint {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(17,10,26,.16);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(12px);
      font-size: .8rem;
      font-weight: 720;
      opacity: .9;
      transition: opacity 300ms ease;
    }

    .click-burst {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
      z-index: 50;
      translate: -50% -50%;
      animation: burst 650ms ease-out forwards;
      box-shadow: 0 0 35px 8px var(--accent);
    }
    @keyframes burst {
      from { scale: .2; opacity: .95; }
      to { scale: 9; opacity: 0; }
    }

    @media (max-width: 760px) {
      main { width: min(100% - 20px, 1180px); padding-top: 14px; }
      .mini { display: none; }
      .copy { top: 4%; left: 4%; }
      h1 { font-size: clamp(3.1rem, 15vw, 6rem); }
      .copy p { max-width: 28ch; font-size: .9rem; }
      .stage-wrap { width: 95vw; margin-top: 13vh; }
      .sticker { right: .2rem; bottom: -3.4rem; width: 92px; border-width: 5px; }
      footer { padding-bottom: 4px; }
      .hint { font-size: .72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="message-modal" id="messageModal" aria-hidden="true">
    <div class="message-card" role="dialog" aria-modal="true" aria-label="Bibble message">
      <button class="message-close" id="messageClose" type="button" aria-label="Close message">×</button>
      <p class="message-text">wagy cocanara</p>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const video = document.getElementById('bibble');
    video.src = 'bibble.mp4';
    video.load();
    const stage = document.getElementById('stage');
    const stageWrap = document.getElementById('stageWrap');
    const muteBtn = document.getElementById('muteBtn');
    const paletteBtn = document.getElementById('paletteBtn');
    const hint = document.getElementById('hint');
    const clickMe = document.getElementById('clickMe');
    const messageModal = document.getElementById('messageModal');
    const messageClose = document.getElementById('messageClose');
    const bibbleShell = document.getElementById('bibbleShell');
    const bibbleTip = document.getElementById('bibbleTip');

    // The normal dance loops over the first 2 seconds. Tapping Bibble temporarily
    // plays the second half of the render as his special wave/reaction.
    let bibbleReacting = false;
    let reactionSafetyTimer = null;

    async function ensureVideoPlaying() {
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      try {
        await video.play();
        bibbleShell.classList.remove('play-blocked');
        bibbleTip.textContent = 'tap Bibble ♡';
      } catch (err) {
        bibbleShell.classList.add('play-blocked');
        bibbleTip.textContent = 'tap Bibble to play ♡';
      }
    }

    function returnToDance() {
      bibbleReacting = false;
      clearTimeout(reactionSafetyTimer);
      try { video.currentTime = 0; } catch (_) {}
      ensureVideoPlaying();
    }

    video.addEventListener('timeupdate', () => {
      if (bibbleReacting) {
        if (video.currentTime >= 3.94) returnToDance();
      } else if (video.currentTime >= 1.98) {
        video.currentTime = 0;
      }
    });

    video.addEventListener('loadeddata', ensureVideoPlaying);
    video.addEventListener('canplay', ensureVideoPlaying, { once: true });
    window.addEventListener('pageshow', ensureVideoPlaying);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) ensureVideoPlaying();
    });
    setTimeout(ensureVideoPlaying, 120);

    function popBibbleHearts() {
      const specs = [
        {x: -48, r: -14, d: 0},
        {x: 0, r: 7, d: 80},
        {x: 50, r: 15, d: 155}
      ];
      specs.forEach(({x, r, d}) => {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.className = 'heart-reaction';
          heart.textContent = '♥';
          heart.style.setProperty('--hx', `${x}px`);
          heart.style.setProperty('--hr', `${r}deg`);
          bibbleShell.appendChild(heart);
          setTimeout(() => heart.remove(), 1150);
        }, d);
      });
    }

    async function reactBibble(e) {
      if (e) e.stopPropagation();

      nextPalette();
      const rect = bibbleShell.getBoundingClientRect();
      const x = e && Number.isFinite(e.clientX) && e.clientX ? e.clientX : rect.left + rect.width / 2;
      const y = e && Number.isFinite(e.clientY) && e.clientY ? e.clientY : rect.top + rect.height / 2;
      burst(x, y);

      if (!ctx) await startAudio();

      popBibbleHearts();
      bibbleShell.classList.remove('bibble-reacting');
      void bibbleShell.offsetWidth;
      bibbleShell.classList.add('bibble-reacting');
      setTimeout(() => bibbleShell.classList.remove('bibble-reacting'), 950);

      bibbleReacting = true;
      clearTimeout(reactionSafetyTimer);
      try { video.currentTime = 2.02; } catch (_) {}
      await ensureVideoPlaying();
      reactionSafetyTimer = setTimeout(returnToDance, 2200);
    }

    bibbleShell.addEventListener('click', reactBibble);
    bibbleShell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        reactBibble(e);
      }
    });

    const palettes = [
      ['#ff7ac8','#7657ff','#79f6e4','#fff7aa'],
      ['#ff9d6c','#ff4f91','#815cff','#aef8ff'],
      ['#67e8c9','#2477ff','#a855f7','#ffe66d'],
      ['#ff5fa2','#ff965b','#6b5cff','#c4ffef'],
      ['#5eead4','#0ea5e9','#8b5cf6','#ffd166'],
      ['#ff8cc6','#fc5c7d','#6a82fb','#d9ffb7'],
      ['#b8f2e6','#6c63ff','#ff70a6','#fff3b0'],
      ['#ffcf6e','#ff5e8d','#8f6cff','#94f3e4']
    ];
    let paletteIndex = 0;

    function setPalette(index) {
      const p = palettes[index % palettes.length];
      root.style.setProperty('--bg1', p[0]);
      root.style.setProperty('--bg2', p[1]);
      root.style.setProperty('--bg3', p[2]);
      root.style.setProperty('--accent', p[3]);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', p[0]);
    }

    function nextPalette() {
      let next;
      do next = Math.floor(Math.random() * palettes.length); while (next === paletteIndex && palettes.length > 1);
      paletteIndex = next;
      setPalette(paletteIndex);
    }

    function burst(x, y) {
      const b = document.createElement('span');
      b.className = 'click-burst';
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 700);
    }

    // Subtle mouse-driven 3D parallax on desktop.
    window.addEventListener('pointermove', (e) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const x = (e.clientX / innerWidth - .5) * 7;
      const y = (e.clientY / innerHeight - .5) * -6;
      stage.style.transform = `translateZ(30px) rotateY(${x}deg) rotateX(${y}deg)`;
    });
    window.addEventListener('pointerleave', () => stage.style.transform = 'translateZ(30px)');

    // Procedural lo-fi player: mellow chords + vinyl noise + a soft beat.
    let ctx, master, noiseSource, noiseGain, musicTimer;
    let audioOn = false;
    let step = 0;

    const chordSets = [
      [261.63, 311.13, 392.00, 466.16], // Cm7-ish
      [207.65, 261.63, 311.13, 392.00], // Ab-ish
      [233.08, 293.66, 349.23, 440.00], // Bb-ish
      [196.00, 246.94, 293.66, 369.99]  // Gm-ish
    ];

    function createAudio() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = .36;
      master.connect(ctx.destination);

      const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * .26;
      noiseSource = ctx.createBufferSource();
      noiseSource.buffer = buffer;
      noiseSource.loop = true;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.value = 2400;
      noiseGain = ctx.createGain();
      noiseGain.gain.value = .018;
      noiseSource.connect(noiseFilter).connect(noiseGain).connect(master);
      noiseSource.start();
    }

    function tone(freq, time, duration=.58, volume=.035, detune=0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.detune.value = detune;
      filter.type = 'lowpass';
      filter.frequency.value = 1250;
      gain.gain.setValueAtTime(.0001, time);
      gain.gain.exponentialRampToValueAtTime(volume, time + .035);
      gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
      osc.connect(filter).connect(gain).connect(master);
      osc.start(time); osc.stop(time + duration + .05);
    }

    function kick(time) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(105, time);
      osc.frequency.exponentialRampToValueAtTime(46, time + .13);
      gain.gain.setValueAtTime(.13, time);
      gain.gain.exponentialRampToValueAtTime(.0001, time + .19);
      osc.connect(gain).connect(master); osc.start(time); osc.stop(time + .21);
    }

    function hat(time, vol=.018) {
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .05, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      const hp = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      hp.type = 'highpass'; hp.frequency.value = 5200;
      gain.gain.setValueAtTime(vol, time);
      gain.gain.exponentialRampToValueAtTime(.0001, time + .045);
      src.buffer = buffer; src.connect(hp).connect(gain).connect(master);
      src.start(time);
    }

    function snare(time) {
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .13, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/data.length);
      const src = ctx.createBufferSource();
      const bp = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = .7;
      gain.gain.setValueAtTime(.04, time);
      gain.gain.exponentialRampToValueAtTime(.0001, time + .12);
      src.buffer = buffer; src.connect(bp).connect(gain).connect(master); src.start(time);
    }

    function scheduleBar() {
      if (!audioOn || !ctx) return;
      const now = ctx.currentTime + .04;
      const beat = .55; // ~109 BPM
      const chord = chordSets[step % chordSets.length];

      chord.forEach((f, i) => {
        tone(f / 2, now, beat * 3.7, .018, i % 2 ? -5 : 4);
        tone(f, now + .012, beat * 3.2, .012, i % 2 ? 4 : -4);
      });

      for (let i = 0; i < 8; i++) {
        const t = now + i * (beat/2);
        hat(t, i % 2 ? .011 : .016);
        if (i === 0 || i === 4) kick(t);
        if (i === 2 || i === 6) snare(t + .012);
      }

      step++;
      musicTimer = setTimeout(scheduleBar, beat * 4 * 1000 - 70);
    }

    async function startAudio() {
      createAudio();
      if (ctx.state === 'suspended') await ctx.resume();
      if (!audioOn) {
        audioOn = true;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setTargetAtTime(.36, ctx.currentTime, .08);
        scheduleBar();
      }
      muteBtn.textContent = 'sound: on';
      hint.textContent = '♪ lo-fi is playing · click anywhere for a new palette';
    }

    function toggleAudio() {
      if (!ctx || !audioOn) { startAudio(); return; }
      audioOn = false;
      clearTimeout(musicTimer);
      master.gain.setTargetAtTime(.0001, ctx.currentTime, .06);
      muteBtn.textContent = 'sound: off';
      hint.textContent = '♪ sound paused · click sound to bring it back';
    }


    function openMessage() {
      messageModal.classList.add('open');
      messageModal.setAttribute('aria-hidden', 'false');
    }

    function closeMessage() {
      messageModal.classList.remove('open');
      messageModal.setAttribute('aria-hidden', 'true');
    }

    async function activateClickMe(e) {
      if (e) e.stopPropagation();
      nextPalette();
      const rect = clickMe.getBoundingClientRect();
      const x = e && Number.isFinite(e.clientX) && e.clientX ? e.clientX : rect.left + rect.width / 2;
      const y = e && Number.isFinite(e.clientY) && e.clientY ? e.clientY : rect.top + rect.height / 2;
      burst(x, y);
      if (!ctx) await startAudio();
      openMessage();
    }

    clickMe.addEventListener('click', activateClickMe);
    clickMe.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activateClickMe(e);
      }
    });

    messageClose.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMessage();
    });

    messageModal.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target === messageModal) closeMessage();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMessage();
    });

    document.addEventListener('click', async (e) => {
      nextPalette();
      burst(e.clientX, e.clientY);
      if (!ctx) await startAudio();
      await ensureVideoPlaying();
    });

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      nextPalette();
      burst(e.clientX, e.clientY);
      toggleAudio();
    });

    paletteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      nextPalette();
      burst(e.clientX, e.clientY);
      if (!ctx) startAudio();
    });
  </script>
</body>
</html>
